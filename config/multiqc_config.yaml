# Configuración personalizada para MultiQC
# Configurar el logotipo personalizado
custom_logo: "./config/logo.png"  # Ruta al archivo del logo (puede ser relativa o absoluta)
custom_logo_url: "https://github.com/trippv/integrity_massively"  # URL opcional a la que enlazará el logo

intro_text: "REPORTE DE MUESTRA"

# Información del encabezado del informe
report_header_info:
  - Nombre: "Thalassomics"
  - Contacto: "info@thalassomics.com"
  - Sitio Web: "https://github.com/trippv/integrity_massively"
  - Tipo de proyecto: "RNA-seq"
  - Platafora: "HiSeq 2500 High Output V4"
  - Setup: "2x125"



# Opcional: Configuración adicional para personalizar el informe
show_analysis_paths: False  # No mostrar rutas de archivos en el informe
show_analysis_time: False   # Mostrar la fecha y hora del análisis
disable_version_detection: false
skip_versions_section: false


# orden de los modulos
top_modules:
  - "fastp"
  - "samtools"
  - "bowtie2"
  - "gffcompare"
  - "busco"


custom_data:
  pca_plot:
    fn: "pca_plot*"
    section_name: "Abundancia y Expresión diferencial"
    description: "Este es un modulo de abundancia y expresión diferencial"
  samtools:
    fn: "*samtools.stat"
    section_name: "samtools REsults"
    description: "Este es un modulo de abundancia y expresión diferencial"


custom_data:
    my_genstats:
        plot_type: 'generalstats'
        headers:
            col_1:
                max: 100
                min: 0
                scale: 'RdYlGn'
                format: '{:.1f}%'
            col_2:
                min: 0
        data:
            sample_a:
                col_1: 1.32
                col_2: 1.2
            sample_b:
                col_1: 0.89
                col_2: 1.9
            sample_c:
                col_1: 61.34
                col_2: 1.24
            sample_d:
                col_1: 88.23
                col_2: 1.9
    my_data_type:
        id: 'mqc_config_file_section'
        section_name: 'My Custom Section'
        description: 'This data comes from a single multiqc_config.yaml file'
        plot_type: 'bargraph'
        pconfig:
            id: 'barplot_config_only'
            title: 'MultiQC Config Data Plot'
            ylab: 'Number of things'
        data:
            sample_a:
                first_thing: 12
                second_thing: 14
            sample_b:
                first_thing: 8
                second_thing: 6
            sample_c:
                first_thing: 11
                second_thing: 5
            sample_d:
                first_thing: 12
                second_thing: 9
    example_coverage:
        file_format: 'tsv'
        section_name: 'Coverage Decay'
        description: 'This plot comes from files acommpanied by a mutliqc_config.yaml file for configuration'
        plot_type: 'linegraph'
        pconfig:
            id: 'example_coverage_lineplot'
            title: 'Coverage Decay'
            ylab: 'X Coverage'
            ymax: 100
            ymin: 0
sp:
    example_coverage:
        fn: 'example_coverage_*'

custom_data:
    distance:
        id: 'distance'
        section_name: 'Matriz de distancia'
        plot_type: 'heatmap'
        pconfig:
            id: 'distancia_heatmap'
        cluster_cols: true
        sort_rows: true
        legend: 'abundancia'
        colorscale: 'viridis'

sp:
    distance:
        fn: '*distance_matrix.txt'


